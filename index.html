<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="app.css">
  <title>Frontend Mentor | Social links profile</title>
</head>

<body>
  <main>
    <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall thumbnail" class="avatar">
    <h1 class="name">Jessica Randall</h1>
    <p class="location">London, United Kingdom</p>
    <p class="title">"Front-end developer and avid reader."</p>
    <div class="links_container">
      <a href="#" class="github">GitHub</a>
      <a href="#" class="fem">Frontend Mentor</a>
      <a href="#" class="linkedin">LinkedIn</a>
      <a href="#" class="twitter">Twitter</a>
      <a href="#" class="instagram">Instagram</a>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">xntou97</a>.
  </footer>
</body>

</html>
