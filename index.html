<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>
</head>

<body>
  <main>
    <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall thumbnail" class="avatar">
    <h1 class="name">Jessica Randall</h1>
    <p class="location">London, United Kingdom</p>
    <p class="title">"Front-end developer and avid reader."</p>
    <div class="links_container">
      <a href="#" class="social_link">GitHub</a>
      <a href="#" class="social_link">Frontend Mentor</a>
      <a href="#" class="social_link">LinkedIn</a>
      <a href="#" class="social_link">Twitter</a>
      <a href="#" class="social_link">Instagram</a>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">xntou97</a>.
  </footer>
</body>

</html>
